<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Anniversary</title>

    <style>
        /* ANIMATIONS */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes floatingHearts {
            0% {
                opacity: 1;
                transform: translateY(100vh) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-100vh) scale(1);
            }
        }

        /* STYLING FOR THE WHOLE PAGE */
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffc0e0, #ffb3d9);
            min-height: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* FLOATING HEARTS BACKGROUND */
        .heart {
            position: fixed;
            pointer-events: none;
            font-size: 24px;
            animation: floatingHearts 8s linear forwards;
        }

        /* STYLING FOR THE COUNTDOWN SECTION */
        #countdown-section {
            background: white;
            border-radius: 20px;
            padding: 60px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            max-height: 500px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            animation: fadeIn 1s ease-in, slideInUp 1s ease-out;
            margin-bottom: 100px;
            margin-top: 200px;
        }

        #countdown-section h1 {
            font-size: 36px;
            color: #ff99cc;
            margin-bottom: 30px;
            animation: float 3s ease-in-out infinite;
            flex-shrink: 0;
        }

        .password-section {
            margin-top: 1000px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            text-align: center;
        }

        /* THE COUNTDOWN TIMER NUMBERS */
        #countdown-timer {
            font-size: 28px;
            color: #333;
            display: flex;
            justify-content: space-around;
            gap: 30px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        #countdown-timer span {
            background: #ffe6f0;
            padding: 20px;
            border-radius: 10px;
            min-width: 100px;
            font-weight: bold;
            color: #ff99cc;
            animation: bounce 2s ease-in-out infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .countdown-label {
            font-size: 12px;
            color: #ff99cc;
            font-weight: normal;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .countdown-number {
            font-size: 32px;
            font-weight: bold;
        }

        /* STYLING FOR THE MAIN SECTION (Single Photo + Text) */
        #main-section {
            background: white;
            border-radius: 20px;
            padding: 50px;
            max-width: 800px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.8s ease-in;
            text-align: center;
        }

        #main-section h1 {
            font-size: 36px;
            color: #ff99cc;
            margin-bottom: 30px;
            animation: slideInUp 0.8s ease-out;
        }

        .photo-container {
            margin-bottom: 30px;
            animation: slideInUp 0.8s ease-out;
        }

        .main-photo {
            width: 100%;
            max-width: 600px;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(255, 153, 204, 0.3);
            display: block;
            margin: 0 auto;
        }

        .main-text {
            font-size: 18px;
            color: #333;
            line-height: 1.8;
            margin-top: 20px;
            font-style: italic;
        }

        /* MOBILE FRIENDLY */
        @media (max-width: 600px) {
            #countdown-section, #main-section {
                padding: 30px;
                max-width: 100%;
            }

            #countdown-timer {
                font-size: 20px;
                gap: 15px;
            }

            #countdown-timer span {
                min-width: 60px;
                padding: 15px;
            }

            .main-photo {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- COUNTDOWN SECTION -->
    <div id="countdown-section">
        <h1>Countdown to Anniversary 💕</h1>
        <div id="countdown-timer">
            <span id="days">
                <div class="countdown-label">Days</div>
                <div class="countdown-number">0</div>
            </span>
            <span id="hours">
                <div class="countdown-label">Hours</div>
                <div class="countdown-number">0</div>
            </span>
            <span id="minutes">
                <div class="countdown-label">Minutes</div>
                <div class="countdown-number">0</div>
            </span>
            <span id="seconds">
                <div class="countdown-label">Seconds</div>
                <div class="countdown-number">0</div>
            </span>
        </div>
    </div>

    <!-- PASSWORD BYPASS -->
    <div class="password-section">
        <p style="color: #999; font-size: 12px;">🔐 Secret bypass (for testing)</p>
        <input type="password" id="passwordInput" placeholder="Enter password"
               style="padding: 10px; border: 2px solid #ffb3d9; border-radius: 5px; width: 150px;">
        <button id="unlockButton"
                style="padding: 10px 20px; background: #ff99cc; color: white; border: none; border-radius: 5px; cursor: pointer; margin-left: 10px;">
            Unlock
        </button>
    </div>

    <!-- MAIN SECTION (Single Photo + Text) -->
    <div id="main-section" style="display: none;">
        <h1>Our Love Story 💕</h1>
        <div class="photo-container">
            <img src="https://via.placeholder.com/600x500?text=Our+Anniversary+Photo" alt="Anniversary Photo" class="main-photo">
        </div>
        <p class="main-text">💕 The day our love story became even more beautiful. Thank you for being my person. I love you more each day. Happy Anniversary! 💕</p>
    </div>

    <script>
        // ========== FLOATING HEARTS ANIMATION ==========
        function createFloatingHeart() {
            const heart = document.createElement("div");
            heart.className = "heart";
            const hearts = ["💕", "💖", "💗", "💝", "💓"];
            heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
            heart.style.left = Math.random() * 100 + "%";
            heart.style.top = Math.random() * 100 + "%";
            heart.style.animationDuration = (3 + Math.random() * 2) + "s";
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        setInterval(createFloatingHeart, 200);

        // ========== COUNTDOWN TIMER ==========
        const targetDate = new Date("May 10, 2026 00:00:00 UTC").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const timeRemaining = targetDate - now;

            const days = Math.floor(timeRemaining / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeRemaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeRemaining % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeRemaining % (1000 * 60)) / 1000);

            document.querySelector("#days .countdown-number").textContent = days;
            document.querySelector("#hours .countdown-number").textContent = hours;
            document.querySelector("#minutes .countdown-number").textContent = minutes;
            document.querySelector("#seconds .countdown-number").textContent = seconds;

            if (timeRemaining < 0) {
                revealMain();
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // ========== PASSWORD UNLOCK ==========
        const correctPassword = "dudu";

        document.getElementById("unlockButton").addEventListener("click", function() {
            const enteredPassword = document.getElementById("passwordInput").value;

            if (enteredPassword === correctPassword) {
                alert("🎉 Unlocked! Welcome to our memory!");
                revealMain();
            } else {
                alert("❌ Wrong password! Try again.");
            }
        });

        // ========== REVEAL MAIN SECTION ==========
        function revealMain() {
            document.getElementById("countdown-section").style.display = "none";
            document.getElementById("main-section").style.display = "block";
        }
    </script>
</body>
</html>
