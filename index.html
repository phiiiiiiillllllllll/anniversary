<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Anniversary</title>

    <style>
        /* ANIMATIONS */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes floatingHearts {
            0% { opacity: 1; transform: translateY(100vh) scale(1); }
            100% { opacity: 0; transform: translateY(-100vh) scale(1); }
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffc0e0, #ffb3d9);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .heart {
            position: fixed;
            pointer-events: none;
            font-size: 24px;
            animation: floatingHearts 8s linear forwards;
            z-index: 0;
        }

        #countdown-section {
            background: white;
            border-radius: 20px;
            padding: 60px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            display: flex;
            flex-direction: column;
            animation: fadeIn 1s ease-in, slideInUp 1s ease-out;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        #countdown-section h1 {
            font-size: 36px;
            color: #ff99cc;
            margin-bottom: 30px;
            animation: float 3s ease-in-out infinite;
            flex-shrink: 0;
        }

        .password-section {
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        #countdown-timer {
            font-size: 28px;
            color: #333;
            display: flex;
            justify-content: space-around;
            gap: 30px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        #countdown-timer span {
            background: #ffe6f0;
            padding: 20px;
            border-radius: 10px;
            min-width: 100px;
            font-weight: bold;
            color: #ff99cc;
            animation: bounce 2s ease-in-out infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .countdown-label {
            font-size: 12px;
            color: #ff99cc;
            font-weight: normal;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .countdown-number {
            font-size: 32px;
            font-weight: bold;
        }

        #main-section {
            background: white;
            border-radius: 20px;
            padding: 50px;
            max-width: 800px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.8s ease-in;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        #main-section h1 {
            font-size: 36px;
            color: #ff99cc;
            margin-bottom: 30px;
            animation: slideInUp 0.8s ease-out;
        }

        .photo-container {
            margin-bottom: 30px;
            animation: slideInUp 0.8s ease-out;
            min-height: 200px;
        }

        .main-photo {
            width: 100%;
            max-width: 600px;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(255, 153, 204, 0.3);
            display: block;
            margin: 0 auto;
        }

        .main-text {
            font-size: 18px;
            color: #333;
            line-height: 1.8;
            margin-top: 20px;
            font-style: italic;
        }

        @media (max-width: 600px) {
            #countdown-section, #main-section {
                padding: 30px;
                max-width: 100%;
            }
            #countdown-timer {
                font-size: 20px;
                gap: 15px;
            }
            #countdown-timer span {
                min-width: 60px;
                padding: 15px;
            }
            .main-photo {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <div id="countdown-section">
        <h1>Countdown to Anniversary &#128150;</h1>
        <div id="countdown-timer">
            <span id="days">
                <div class="countdown-label">Days</div>
                <div class="countdown-number">0</div>
            </span>
            <span id="hours">
                <div class="countdown-label">Hours</div>
                <div class="countdown-number">0</div>
            </span>
            <span id="minutes">
                <div class="countdown-label">Minutes</div>
                <div class="countdown-number">0</div>
            </span>
            <span id="seconds">
                <div class="countdown-label">Seconds</div>
                <div class="countdown-number">0</div>
            </span>
        </div>
    </div>

    <div class="password-section">
        <p style="color: #999; font-size: 12px;">&#128272; Secret bypass (for testing)</p>
        <input type="password" id="passwordInput" placeholder="Enter password"
               style="padding: 10px; border: 2px solid #ffb3d9; border-radius: 5px; width: 150px;">
        <button id="unlockButton"
                style="padding: 10px 20px; background: #ff99cc; color: white; border: none; border-radius: 5px; cursor: pointer; margin-left: 10px;">
            Unlock
        </button>
    </div>

    <div id="main-section" style="display: none;">
        <h1>Our Love Story &#128150;</h1>
        <div class="photo-container">
            <img id="daily-photo" src="" alt="Daily Photo" class="main-photo">
        </div>
        <p id="daily-message" class="main-text"></p>
        <p style="color: #999; font-size: 12px; margin-top: 20px;" id="daily-date"></p>
    </div>

    <script>
        // ========== FLOATING HEARTS ==========
        function createFloatingHeart() {
            const heart = document.createElement("div");
            heart.className = "heart";
            const hearts = ["\u{1F495}", "\u{1F496}", "\u{1F497}", "\u{1F49D}", "\u{1F493}"];
            heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
            heart.style.left = Math.random() * 100 + "%";
            heart.style.top = Math.random() * 100 + "%";
            heart.style.animationDuration = (3 + Math.random() * 2) + "s";
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
        setInterval(createFloatingHeart, 200);

        // ========== HELPERS ==========
        // Build a Google Drive URL that actually works inside an <img> tag.
        // The old `uc?export=view&id=...` and `/preview` URLs no longer render
        // in <img>; the thumbnail endpoint does.
        function driveImageUrl(rawUrl) {
            if (!rawUrl) return "";
            // Match the file ID from any common Drive URL shape.
            const idMatch = rawUrl.match(/[-\w]{25,}/);
            if (!idMatch) return rawUrl; // not a Drive URL, leave alone
            const id = idMatch[0];
            return `https://drive.google.com/thumbnail?id=${id}&sz=w1600`;
        }

        function getTodayDateString() {
            const today = new Date();
            today.setFullYear(today.getFullYear() - 1); // anniversary mode: 1 year back
            return today.getFullYear() + "-" +
                   String(today.getMonth() + 1).padStart(2, '0') + "-" +
                   String(today.getDate()).padStart(2, '0');
        }

        // ========== DAILY PHOTOS FROM SHEET ==========
        let dailyMessages = [];
        let sheetReady = false;
        let sheetPromise = null;

        const sheetUrl = "https://docs.google.com/spreadsheets/d/1XgslBCqSHRcINh2Z_JdrJx6VcvDSZFM717mRp28vw34/gviz/tq?tqx=out:json";

        sheetPromise = fetch(sheetUrl)
            .then(r => r.text())
            .then(text => {
                const jsonStr = text.match(/\{.*\}/s)[0];
                const json = JSON.parse(jsonStr);

                json.table.rows.forEach(row => {
                    if (row.c && row.c[0] && row.c[1] && row.c[2]) {
                        let dateStr = row.c[0].v;
                        const dateMatch = String(dateStr).match(/Date\((\d+),(\d+),(\d+)\)/);
                        if (dateMatch) {
                            const year = dateMatch[1];
                            const month = String(parseInt(dateMatch[2]) + 1).padStart(2, '0');
                            const day = String(dateMatch[3]).padStart(2, '0');
                            dateStr = `${year}-${month}-${day}`;
                        }

                        dailyMessages.push({
                            date: dateStr,
                            photo: row.c[1].v,   // store raw URL; convert at render time
                            message: row.c[2].v
                        });
                    }
                });
                sheetReady = true;
                console.log("Loaded", dailyMessages.length, "entries from sheet");
            })
            .catch(err => {
                console.error("Error loading sheet:", err);
                sheetReady = true; // unblock revealMain even on failure
            });

        function renderTodayPhoto() {
            const dateString = getTodayDateString();
            const todayData = dailyMessages.find(d => d.date === dateString);
            const photoEl = document.getElementById("daily-photo");
            const msgEl = document.getElementById("daily-message");
            const dateEl = document.getElementById("daily-date");

            if (todayData) {
                const url = driveImageUrl(todayData.photo);
                console.log("Today's photo URL:", url);
                photoEl.onerror = () => {
                    console.warn("Image failed to load:", url);
                    photoEl.alt = "Photo couldn't load — check that the Drive file is shared as 'Anyone with the link'.";
                };
                photoEl.src = url;
                msgEl.textContent = todayData.message;
                dateEl.textContent = dateString;
            } else {
                photoEl.src = "";
                photoEl.alt = "No photo yet for " + dateString;
                msgEl.textContent = "\u{1F495} Coming soon...";
                dateEl.textContent = dateString;
            }
        }

        // ========== COUNTDOWN ==========
        const targetDate = new Date("May 10, 2026 11:00:00 UTC").getTime();

        function updateCountdown() {
            const now = Date.now();
            const timeRemaining = targetDate - now;

            const days = Math.max(0, Math.floor(timeRemaining / (1000 * 60 * 60 * 24)));
            const hours = Math.max(0, Math.floor((timeRemaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)));
            const minutes = Math.max(0, Math.floor((timeRemaining % (1000 * 60 * 60)) / (1000 * 60)));
            const seconds = Math.max(0, Math.floor((timeRemaining % (1000 * 60)) / 1000));

            document.querySelector("#days .countdown-number").textContent = days;
            document.querySelector("#hours .countdown-number").textContent = hours;
            document.querySelector("#minutes .countdown-number").textContent = minutes;
            document.querySelector("#seconds .countdown-number").textContent = seconds;

            if (timeRemaining <= 0) {
                revealMain();
            }
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // ========== PASSWORD ==========
        const correctPassword = "dudu";
        document.getElementById("unlockButton").addEventListener("click", function () {
            const entered = document.getElementById("passwordInput").value;
            if (entered === correctPassword) {
                revealMain();
            } else {
                alert("❌ Wrong password! Try again.");
            }
        });

        // ========== REVEAL ==========
        let revealed = false;
        function revealMain() {
            if (revealed) return;
            revealed = true;

            // Wait for the sheet fetch before rendering, so dailyMessages is populated.
            (sheetPromise || Promise.resolve()).finally(() => {
                renderTodayPhoto();
                document.getElementById("countdown-section").style.display = "none";
                document.querySelector(".password-section").style.display = "none";
                document.getElementById("main-section").style.display = "block";
            });
        }
    </script>
</body>
</html>
